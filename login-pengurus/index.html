<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Pengurus | PRISMA Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="font-sans text-slate-900 antialiased">

    <!-- Background Container -->
    <div class="relative min-h-screen flex flex-col items-center justify-center p-4 bg-cover bg-center bg-no-repeat" 
         style="background-image: url('https://images.unsplash.com/photo-1497366216548-37526070297c?q=80&w=2000&auto=format&fit=crop');">
        
        <!-- Darker/Indigo Overlay with Blur for Admin -->
        <div class="absolute inset-0 bg-slate-900/75 backdrop-blur-md"></div>

        <!-- Login Card -->
        <div class="relative z-10 max-w-md w-full bg-white rounded-3xl shadow-2xl border border-white/10 p-8">
            
            <!-- Header & Branding -->
            <div class="text-center mb-8">
                <div class="w-14 h-14 bg-slate-900 rounded-2xl flex items-center justify-center text-white mx-auto mb-4 shadow-lg shadow-slate-300">
                    <i class="fas fa-shield-alt text-2xl"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">PRISMA Panel</h1>
                <p class="text-sm font-semibold text-indigo-600 uppercase tracking-widest mt-1">Admin</p>
            </div>

            <!-- Form -->
            <form action="#" method="POST" class="space-y-5">
                
                <!-- Email Input -->
                <div class="space-y-1.5">
                    <label class="text-sm font-semibold text-slate-700">Email Administratif</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-envelope text-slate-400"></i>
                        </div>
                        <input type="email" placeholder="admin@prisma.com" required
                            class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-slate-900 focus:border-slate-900 outline-none transition">
                    </div>
                </div>

                <!-- Password Input -->
                <div class="space-y-1.5">
                    <div class="flex justify-between items-center">
                        <label class="text-sm font-semibold text-slate-700">Kata Sandi</label>
                        <a href="#" class="text-xs font-semibold text-slate-500 hover:text-slate-800 transition">Lupa sandi?</a>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-slate-400"></i>
                        </div>
                        <input type="password" id="password" placeholder="Masukkan kata sandi pengurus" required
                            class="w-full pl-11 pr-12 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-slate-900 focus:border-slate-900 outline-none transition">
                        <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none">
                            <i id="eye-icon" class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full py-3.5 bg-slate-900 text-white font-bold rounded-xl hover:bg-black shadow-lg shadow-slate-300 transition-all active:scale-[0.98] mt-6 flex justify-center items-center gap-2">
                    Login <i class="fas fa-unlock-alt"></i>
                </button>
                
            </form>
        </div>

        <!-- Link back to Anggota Login -->
        <a href="/login" class="relative z-10 mt-6 text-white/70 hover:text-white text-sm font-medium flex items-center gap-2 transition">
            <i class="fas fa-arrow-left"></i> Kembali ke Portal Anggota
        </a>
    </div>

    <script>
        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.className = 'fas fa-eye-slash';
            } else {
                pwdInput.type = 'password';
                eyeIcon.className = 'fas fa-eye';
            }
        }
    </script>
</body>
</html>
