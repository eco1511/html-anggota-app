<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Anggota | PRISMA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="font-sans text-slate-900 antialiased">

    <!-- Background Container -->
    <div class="relative min-h-screen flex flex-col items-center justify-center p-4 bg-cover bg-center bg-no-repeat" 
         style="background-image: url('https://images.unsplash.com/photo-1557682250-33bd709cbe85?q=80&w=2000&auto=format&fit=crop');">
        
        <!-- Blue Overlay with Blur -->
        <div class="absolute inset-0 bg-blue-900/60 backdrop-blur-sm"></div>

        <!-- Login Card -->
        <div class="relative z-10 max-w-md w-full bg-white rounded-3xl shadow-2xl border border-white/20 p-8">
            
            <!-- Header & Branding -->
            <div class="text-center mb-8">
                <div class="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center text-white mx-auto mb-4 shadow-lg shadow-blue-200 transform -rotate-3">
                    <i class="fas fa-users text-2xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900">Portal Anggota</h1>
                <p class="text-sm text-slate-500 mt-1">PRISMA - Antar Narkoba, Tawuran dan Anarkis</p>
            </div>

            <!-- Form -->
            <form action="#" method="POST" class="space-y-5">
                
                <!-- NIK Input -->
                <div class="space-y-1.5">
                    <label class="text-sm font-semibold text-slate-700">Nomor Induk Kependudukan (NIK)</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-id-card text-slate-400"></i>
                        </div>
                        <input type="text" placeholder="Masukkan 16 digit NIK" required
                            class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    </div>
                </div>

                <!-- Password Input -->
                <div class="space-y-1.5">
                    <div class="flex justify-between items-center">
                        <label class="text-sm font-semibold text-slate-700">Kata Sandi</label>
                        <a href="#" class="text-xs font-semibold text-blue-600 hover:text-blue-800 transition">Lupa sandi?</a>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-slate-400"></i>
                        </div>
                        <input type="password" id="password" placeholder="Masukkan kata sandi" required
                            class="w-full pl-11 pr-12 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                        <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none">
                            <i id="eye-icon" class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full py-3.5 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all active:scale-[0.98] mt-4 flex justify-center items-center gap-2">
                    Masuk <i class="fas fa-sign-in-alt"></i>
                </button>
                
            </form>

            <!-- Register Link -->
            <div class="mt-8 text-center pt-6 border-t border-slate-100">
                <p class="text-sm text-slate-500">
                    Belum punya akun? 
                    <a href="/daftar" class="font-bold text-blue-600 hover:text-blue-800 transition">Daftar sekarang</a>
                </p>
            </div>
        </div>

        <!-- Link to Admin Login -->
        <a href="/login-pengurus" class="relative z-10 mt-6 text-white/80 hover:text-white text-sm font-medium flex items-center gap-2 transition">
            <i class="fas fa-shield-alt"></i> Masuk sebagai Pengurus
        </a>
    </div>

    <script>
        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.className = 'fas fa-eye-slash';
            } else {
                pwdInput.type = 'password';
                eyeIcon.className = 'fas fa-eye';
            }
        }
    </script>
</body>
</html>
